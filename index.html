<style>
/* Layout: one night-sky screen — bat-signal-style spotlight up top, heading, a centered cloud of words, city skyline along the bottom. Single committed dark look. */
:root {
  color-scheme: dark;
  --night: #071226;        /* sky */
  --night-2: #0d2147;      /* sky glow */
  --blue: #3d8bff;         /* primary word blue */
  --sky: #9cc8ff;          /* light blue words */
  --ink: #eef4ff;          /* text */
  --muted: #8fa6cc;        /* secondary text */
  --red: #e63946;          /* hero red (sparing) */
  --gold: #ffcf3f;         /* standout gold */
  --panel: #f7f9ff;        /* speech balloon */
  --panel-ink: #0a1a36;
  --display: "Bangers", "Impact", "Arial Black", sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  overflow-x: hidden;
}
.sky {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 1px 1px, rgba(156,200,255,.10) 1px, transparent 1.6px) 0 0 / 14px 14px,
    radial-gradient(ellipse 80% 60% at 50% 0%, var(--night-2), var(--night) 70%);
}
/* spotlight beam with an "E" in the signal */
.beam {
  position: fixed; left: 50%; bottom: 0; width: 46vmin; height: 120vh; z-index: 0; pointer-events: none;
  transform-origin: 50% 100%; transform: translateX(-50%) rotate(14deg);
  background: linear-gradient(to top, rgba(156,200,255,.16), rgba(156,200,255,0) 85%);
  clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0);
}
.signal {
  position: fixed; top: 4vh; right: 8vw; width: 92px; height: 60px; z-index: 0; pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255,240,180,.35), rgba(255,240,180,.08) 60%, transparent 72%);
  display: grid; place-items: center;
  font-family: var(--display); font-size: 34px; color: rgba(7,18,38,.55);
}
.web {
  position: fixed; top: 0; left: 0; width: 180px; height: 180px; z-index: 0; pointer-events: none; opacity: .18;
}
.skyline {
  position: fixed; left: 0; right: 0; bottom: 0; height: 110px; z-index: 0; pointer-events: none;
}
.skyline svg { width: 100%; height: 100%; display: block; }

main {
  position: relative; z-index: 1;
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 56px 150px;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
  text-align: center;
}
.eyebrow {
  font-family: var(--label); text-transform: uppercase; letter-spacing: .18em;
  font-size: 13px; color: var(--sky);
}
h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(48px, 10vw, 96px); line-height: .92; letter-spacing: .02em;
  margin: 0; text-wrap: balance;
  color: var(--ink);
  text-shadow: 3px 3px 0 var(--blue), 6px 6px 0 rgba(230,57,70,.85);
}
.sub { max-width: 52ch; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }

.cloud {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 10px 22px; max-width: 900px; padding: 12px 0;
}
.word {
  appearance: none; background: none; border: 0; cursor: pointer;
  font-family: var(--display); font-weight: 400; line-height: 1; letter-spacing: .03em;
  color: var(--sky); padding: 4px 6px; border-radius: 6px;
  transition: transform .18s ease, color .18s ease, text-shadow .18s ease;
}
.word.c2 { color: var(--blue); }
.word.c3 { color: var(--ink); }
.word.s3 { font-size: clamp(44px, 8vw, 76px); color: var(--ink); text-shadow: 3px 3px 0 var(--blue); }
.word.s2 { font-size: clamp(32px, 5.6vw, 52px); color: var(--blue); text-shadow: 2px 2px 0 rgba(7,18,38,.9); }
.word.s1 { font-size: clamp(22px, 3.6vw, 32px); }
.word.standout { color: var(--gold); text-shadow: 2px 2px 0 var(--red); }
.word.standout::after { content: "✦"; font-size: .5em; vertical-align: super; margin-left: 3px; color: var(--gold); }
.word:hover, .word:focus-visible, .word.active { transform: scale(1.08) rotate(-2deg); color: var(--gold); }
.word:focus-visible { outline: 2px dashed var(--gold); outline-offset: 3px; }

/* comic-panel photos; flex-grow = aspect ratio so both share one height */
.panels { display: flex; gap: 18px; width: 100%; max-width: 860px; margin-top: 16px; }
.panel {
  margin: 0; min-width: 0; background: var(--panel); padding: 6px;
  border: 3px solid var(--panel-ink); box-shadow: 6px 6px 0 var(--blue);
}
.panel img { display: block; width: 100%; height: auto; }
.p1 { flex: 0.893 1 0; transform: rotate(-2deg); }
.p2 { flex: 2.636 1 0; transform: rotate(1.5deg); box-shadow: 6px 6px 0 var(--red); }
.caption {
  margin: 0; font-family: var(--display); font-size: clamp(22px, 4vw, 30px); letter-spacing: .04em;
  color: var(--gold); text-shadow: 2px 2px 0 var(--night);
}
/* tiny Elias: anchored at his feet; JS moves him, CSS classes give the motion */
.scene { position: relative; overflow: hidden; }
.mini {
  position: absolute; left: 38.7%; top: 70%; height: 18%; aspect-ratio: 163 / 360;
  transform: translate(-50%, -100%); transform-origin: 50% 100%; will-change: left, top, opacity;
}
.mini img { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; filter: drop-shadow(0 2px 1px rgba(0,0,0,.35)); }
.mini.walk img  { animation: bob .42s ease-in-out infinite; }
.mini.dance img { animation: dance .5s ease-in-out infinite; }
.mini.wave img  { animation: sway .9s ease-in-out infinite; }
.mini.peek { clip-path: inset(0 0 70% 0); }
@keyframes bob   { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7%) rotate(3deg); } }
@keyframes dance { 0%,100% { transform: rotate(-12deg) scaleX(1); } 25% { transform: translateY(-12%) rotate(0) scaleX(-1); } 50% { transform: rotate(12deg) scaleX(-1); } 75% { transform: translateY(-12%) rotate(0) scaleX(1); } }
@keyframes sway  { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.mini.hop img   { animation: hop .45s ease-in-out infinite; }
@keyframes hop   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18%); } }

/* vehicles: positioned by JS like mini Elias; pilot = Elias's head poking out */
.plane, .heli { position: absolute; will-change: left, top, opacity; opacity: 0; }
.plane { width: 48%; aspect-ratio: 520 / 90; transform: translate(-50%, -50%); }
.heli  { width: 20%; aspect-ratio: 240 / 130; transform: translate(-50%, -91%); transition: rotate .4s ease; }
.heli.fly { rotate: -8deg; }
.plane svg, .heli svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plane .bob { position: absolute; inset: 0; animation: planebob 1.6s ease-in-out infinite; }
@keyframes planebob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10%) rotate(1.5deg); } }
.pilot { position: absolute; aspect-ratio: 163 / 360; transform: translateX(-50%); clip-path: inset(0 0 75% 0); }
.pilot img { display: block; width: 100%; height: 100%; }
.plane .pilot { left: 84.6%; top: 7.5%; height: 190%; }
.heli .pilot  { left: 33%; top: 24%; height: 119%; }
.heli.empty .pilot { visibility: hidden; }
.spin  { transform-box: fill-box; transform-origin: center; animation: spin .16s linear infinite; }
.prop  { transform-box: fill-box; transform-origin: center; animation: prop .12s linear infinite; }
.trot  { transform-box: fill-box; transform-origin: center; animation: trot .2s linear infinite; }
@keyframes spin { 50% { transform: scaleX(.12); } }
@keyframes prop { 50% { transform: scaleY(.15); } }
@keyframes trot { to { transform: rotate(360deg); } }
.banner { font-family: var(--display); }
/* Elias lying along the sign's top edge (edge slopes ~33° down to the right from the corner) */
.lounger {
  position: absolute; left: 49.5%; top: 40.5%; height: 48%; aspect-ratio: 163 / 360;
  transform: translate(-50%, -50%) rotate(-57deg);
}
.lounger img { display: block; width: 100%; height: 100%; transform-origin: 50% 70%; animation: lounge 3.2s ease-in-out infinite; filter: drop-shadow(-4px 6px 4px rgba(0,0,0,.35)); }
@keyframes lounge { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-3deg) translateX(-2%); } }
@media (prefers-reduced-motion: reduce) { .mini img, .lounger img { animation: none !important; } }

@media (max-width: 560px) { .panels { flex-direction: column; } .p1, .p2 { flex: none; } }

.balloon {
  position: fixed; z-index: 5; max-width: min(300px, calc(100vw - 32px));
  background: var(--panel); color: var(--panel-ink);
  border: 3px solid var(--panel-ink); border-radius: 14px;
  box-shadow: 5px 5px 0 var(--blue);
  padding: 12px 14px; text-align: left; pointer-events: none;
}
.balloon h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: .03em; }
.balloon .count { font-family: var(--label); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: #4a6390; margin-bottom: 8px; }
.balloon ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.balloon li { font-size: 15px; line-height: 1.35; }
.balloon li b { font-weight: 700; }
.balloon li span { color: #4a6390; }

.legend { font-family: var(--label); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.legend i { font-style: normal; color: var(--gold); }

/* intro overlay */
.intro {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: rgba(4,10,24,.88); backdrop-filter: blur(4px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.intro button {
  font-family: var(--display); font-size: clamp(30px, 6vw, 44px); letter-spacing: .04em;
  background: var(--blue); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px;
  padding: 14px 30px; cursor: pointer; box-shadow: 6px 6px 0 var(--red);
  transition: transform .15s ease, box-shadow .15s ease;
}
.intro button:hover { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 var(--red); }
.intro p { color: var(--muted); font-size: 15px; margin: 14px 0 0; text-align: center; }
.mute {
  position: fixed; z-index: 6;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font-family: var(--label); font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
  background: rgba(7,18,38,.85); color: var(--ink); border: 2px solid var(--sky); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
}
.draft-tag {
  position: fixed; z-index: 6; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font-family: var(--label); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--night); background: var(--gold); padding: 4px 10px; border-radius: 4px;
}
@media (prefers-reduced-motion: reduce) { .word, .intro button { transition: none; } .word:hover, .word.active { transform: none; } }
</style>

<script>
// Each group: label shown in the cloud, and the exact words + who said them.
const groups = [
  { label: "Selfless",  entries: [["Selfless", "Luzy G"]] },
  { label: "Speedy",    entries: [["Speedy", "Easton G"]] },
  { label: "Poodgy",    entries: [["Poodgy", "Nicco G"]], standout: true },
  { label: "Inspiring", entries: [["Inspirational", "Mom"], ["Role-model", "Edison G"]] },
  { label: "Dashing",   entries: [["Dashing", "David A"]] },
  { label: "Studious",  entries: [["Studious", "Nicco G"]] },
  { label: "Superhero", entries: [["Superhero", "Mom"]], standout: true },
  { label: "Confident", entries: [["Confident", "Melanie A"]] },
  { label: "Twiz",      entries: [["Twiz", "Easton G"]], standout: true },
  { label: "Caring",    entries: [["Caring", "Dad"], ["Compassionate", "Mom"], ["Kind", "Melanie A"]] },
  { label: "Protective",entries: [["Protective", "Elena G"]] },
  { label: "Generous",  entries: [["Generous", "Elena G"]] },
  { label: "Driven",    entries: [["Driven", "Andrew C"]] },
  { label: "Leader",    entries: [["Leader", "Dad"], ["Leader", "Edison G"], ["Leadership", "Mom"]] },
  { label: "Christlike",entries: [["Christlike", "Luzy G"]] },
  { label: "Ya boiiiii",entries: [["Ya boiiiii", "Easton G"]], standout: true },
  { label: "Attentive", entries: [["Attentive", "Dad"], ["Responsive", "Gio G"]] },
  { label: "El mambo king", entries: [["El mambo king", "Gio G"]], standout: true },
  { label: "Adventurous", entries: [["Adventurous", "Andrew C"], ["Daring", "David A"]] },
  { label: "Easy-going",entries: [["Easy-going", "Melanie A"]] },
  { label: "Integrous", entries: [["Integrous", "Andrew C"]] },
  { label: "Scroofage", entries: [["Scroofage", "Nicco G"]], standout: true },
  { label: "Delightful",entries: [["Delightful", "David A"]] },
  { label: "Family guy",entries: [["Family guy", "Elena G"]] },
  { label: "Supporter", entries: [["Supporter", "Edison G"]] },
  { label: "Reliable",  entries: [["Reliable", "Gio G"]] },
  { label: "Eine poojer", entries: [["Eine poojer", "Gio G"]], standout: true },
  { label: "Just objectively cool", entries: [["Just objectively cool", "Luzy G"]], standout: true },
];

const cloud = document.getElementById("cloud");
const balloon = document.getElementById("balloon");
let activeBtn = null;

groups.forEach((g, i) => {
  const n = g.entries.length;
  const b = document.createElement("button");
  b.type = "button";
  b.className = `word s${Math.min(n, 3)} c${(i % 3) + 1}` + (g.standout ? " standout" : "");
  b.textContent = g.label;
  b.style.transform = `rotate(${[-3, 2, 0, -1, 3][i % 5]}deg)`;
  b.setAttribute("aria-label", `${g.label}: said by ${g.entries.map(e => e[1]).join(", ")}`);
  b.addEventListener("mouseenter", () => show(b, g));
  b.addEventListener("mouseleave", () => { if (activeBtn !== b) hide(); });
  b.addEventListener("focus", () => show(b, g));
  b.addEventListener("blur", hide);
  b.addEventListener("click", (e) => { e.stopPropagation(); activeBtn === b ? hide() : (show(b, g), setActive(b)); });
  cloud.appendChild(b);
});

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function setActive(b) { activeBtn?.classList.remove("active"); activeBtn = b; b.classList.add("active"); }
function show(btn, g) {
  balloon.innerHTML =
    `<h2>${esc(g.label)}</h2>` +
    `<ul>${g.entries.map(([w, who]) => `<li><b>“${esc(w)}”</b> <span>— ${esc(who)}</span></li>`).join("")}</ul>`;
  balloon.hidden = false;
  const r = btn.getBoundingClientRect(), bw = balloon.offsetWidth, bh = balloon.offsetHeight;
  let left = Math.min(Math.max(16, r.left + r.width / 2 - bw / 2), innerWidth - bw - 16);
  let top = r.top - bh - 12;
  if (top < 16) top = r.bottom + 12;
  balloon.style.left = left + "px";
  balloon.style.top = top + "px";
}
function hide() { balloon.hidden = true; activeBtn?.classList.remove("active"); activeBtn = null; }
document.addEventListener("click", hide);
addEventListener("scroll", hide, { passive: true });

// Elias's day at the Clyde Building. Spots are % of the cropped photo.
// People and the helicopter are anchored at their feet/skids; the plane at its center.
const spot = {
  mainDoor: [29.1, 94.6], front: [22.4, 98], lotL: [6, 97], sideDoor: [15.6, 85],
  window: [14, 67.7],                     // feet hidden below the sill; only his head shows
  path: [71.8, 94.3], lawnA: [80, 96.4], lawnB: [94.5, 97.9],
  roofOut: [40, 19], roofDish: [34.5, 18.7], roofLeft: [25, 25.9],
  planeIn: [-30, 22], planeOut: [130, 14],
  heliIn: [125, 16], heliHover: [52, 22], heliPad: [52, 33.2], heliAway: [-20, 14],
};
// Each beat: ms, plus optional e = Elias [from, to, motion, height%, fade], p = plane [from, to], c = helicopter [from, to, pilot?, flying?]
const G = 30, R = 20;                     // Elias height on the ground / on the roof
const IN = [0, 1], OUT = [1, 0];
const story = [
  { ms: 600,  e: ["mainDoor", "mainDoor", "", G, IN] },          // out the main door
  { ms: 1500, e: ["mainDoor", "front", "walk", G] },
  { ms: 2000, e: ["front", "lotL", "walk", G] },                 // across the lot
  { ms: 1400, e: ["lotL", "lotL", "wave", G] },
  { ms: 1600, e: ["lotL", "sideDoor", "walk", G] },
  { ms: 500,  e: ["sideDoor", "sideDoor", "", G, OUT] },         // in the side door
  { ms: 500,  e: ["window", "window", "peek", 26, IN] },         // looks out a window
  { ms: 2000, e: ["window", "window", "peek", 26] },
  { ms: 400,  e: ["window", "window", "peek", 26, OUT] },
  { ms: 7000, p: ["planeIn", "planeOut"] },                      // flies overhead with a banner
  { ms: 3000, c: ["heliIn", "heliHover", true, true] },          // helicopter arrives
  { ms: 1600, c: ["heliHover", "heliPad", true] },               // lands on the roof
  { ms: 500,  c: ["heliPad", "heliPad", false], e: ["roofOut", "roofOut", "hop", R, IN] },
  { ms: 1600, c: ["heliPad", "heliPad", false], e: ["roofOut", "roofDish", "walk", R] },
  { ms: 2600, c: ["heliPad", "heliPad", false], e: ["roofDish", "roofDish", "dance", R] },  // dances by the dish
  { ms: 1800, c: ["heliPad", "heliPad", false], e: ["roofDish", "roofLeft", "walk", R] },
  { ms: 2200, c: ["heliPad", "heliPad", false], e: ["roofLeft", "roofLeft", "dance", R] },
  { ms: 2600, c: ["heliPad", "heliPad", false], e: ["roofLeft", "roofOut", "walk", R] },
  { ms: 500,  c: ["heliPad", "heliPad", false], e: ["roofOut", "roofOut", "hop", R, OUT] },
  { ms: 1500, c: ["heliPad", "heliHover", true] },               // takes off
  { ms: 3200, c: ["heliHover", "heliAway", true, true] },
  { ms: 600,  e: ["mainDoor", "mainDoor", "", G, IN] },          // back out the main door
  { ms: 4200, e: ["mainDoor", "path", "walk", G] },              // all the way to the grass
  { ms: 1200, e: ["path", "lawnA", "walk", G] },
  { ms: 2400, e: ["lawnA", "lawnA", "dance", G] },
  { ms: 1600, e: ["lawnA", "lawnB", "walk", G] },
  { ms: 1400, e: ["lawnB", "lawnB", "wave", G] },
  { ms: 6500, e: ["lawnB", "mainDoor", "walk", G] },
  { ms: 500,  e: ["mainDoor", "mainDoor", "", G, OUT] },         // and back inside — loop
];
const mini = document.getElementById("mini"), plane = document.getElementById("plane"), heli = document.getElementById("heli");
const total = story.reduce((t, s) => t + s.ms, 0);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function place(el, a, b, f) {
  const [x1, y1] = spot[a], [x2, y2] = spot[b];
  el.style.left = x1 + (x2 - x1) * f + "%";
  el.style.top = y1 + (y2 - y1) * f + "%";
}
let lastE = null;
function tick(now) {
  let t = now % total, i = 0;
  while (t >= story[i].ms) { t -= story[i].ms; i++; }
  const s = story[i], k = t / s.ms, f = ease(k);
  if (s.e) {
    const [a, b, motion, h, fade] = s.e;
    place(mini, a, b, f);
    mini.style.height = h + "%";
    mini.style.opacity = fade ? fade[0] + (fade[1] - fade[0]) * k : 1;
    if (motion !== lastE) { mini.className = "mini " + motion; lastE = motion; }
  } else mini.style.opacity = 0;
  if (s.p) { place(plane, s.p[0], s.p[1], k); plane.style.opacity = 1; } else plane.style.opacity = 0;
  if (s.c) {
    place(heli, s.c[0], s.c[1], f);
    heli.style.opacity = 1;
    heli.classList.toggle("empty", !s.c[2]);
    heli.classList.toggle("fly", !!s.c[3]);
  } else heli.style.opacity = 0;
  requestAnimationFrame(tick);
}
if (!reduce) requestAnimationFrame(tick);
else { place(mini, "mainDoor", "mainDoor", 0); mini.style.opacity = 1; }

// Intro + music
const song = document.getElementById("song"), mute = document.getElementById("mute");
document.getElementById("open").addEventListener("click", (e) => {
  e.stopPropagation();
  document.getElementById("intro").hidden = true;
  if (song.getAttribute("src")) { song.play().catch(() => {}); mute.hidden = false; }
});
mute.addEventListener("click", () => {
  song.muted = !song.muted;
  mute.textContent = song.muted ? "♪ Music off" : "♪ Music on";
});
</script>
